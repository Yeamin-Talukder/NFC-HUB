<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Connection Lines -->
  <line x1="256" y1="256" x2="256" y2="80" stroke="#00ff88" stroke-width="24" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="256" x2="430" y2="360" stroke="#00ff88" stroke-width="24" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="256" x2="82" y2="360" stroke="#00ff88" stroke-width="24" stroke-linecap="round" opacity="0.8" />
  
  <!-- Inter-node connections (Mesh effect) -->
  <line x1="256" y1="80" x2="430" y2="360" stroke="#00ff88" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <line x1="430" y1="360" x2="82" y2="360" stroke="#00ff88" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <line x1="82" y1="360" x2="256" y2="80" stroke="#00ff88" stroke-width="12" stroke-linecap="round" opacity="0.4" />

  <!-- Nodes -->
  <!-- Center Hub -->
  <circle cx="256" cy="256" r="50" fill="#00ff88" filter="url(#glow)" />
  
  <!-- Satellite Nodes -->
  <circle cx="256" cy="80" r="32" fill="#00ff88" filter="url(#glow)" />
  <circle cx="430" cy="360" r="32" fill="#00ff88" filter="url(#glow)" />
  <circle cx="82" cy="360" r="32" fill="#00ff88" filter="url(#glow)" />
  
  <!-- Small orbital dots for tech feel -->
  <circle cx="390" cy="180" r="12" fill="#fff" opacity="0.8" />
  <circle cx="122" cy="180" r="12" fill="#fff" opacity="0.8" />
  <circle cx="256" cy="420" r="12" fill="#fff" opacity="0.8" />

</svg>
